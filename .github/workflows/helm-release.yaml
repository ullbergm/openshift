name: Release Helm Charts

on:
  push:
    branches:
      - v2
    paths:
      - 'charts/**'
      - '.github/workflows/helm-release.yaml'
      - '.github/helm-repo-index.html'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.14.0

      - name: Add Helm Repositories
        run: |
          # Find all unique repository URLs from Chart.yaml files
          repos=$(find charts -name 'Chart.yaml' -type f -exec grep -h "repository:" {} \; | \
                  grep -v "^#" | \
                  awk '{print $2}' | \
                  tr -d '"' | \
                  sort -u)

          # Add each repository
          for repo_url in $repos; do
            if [[ -n "$repo_url" && "$repo_url" != "file://"* ]]; then
              # Extract a simple name from the URL for the repo
              repo_name=$(echo "$repo_url" | sed 's|https://||' | sed 's|http://||' | sed 's|/|-|g' | sed 's|\.|-|g')
              echo "Adding Helm repo: $repo_name -> $repo_url"
              helm repo add "$repo_name" "$repo_url" || true
            fi
          done

          # Update all repositories
          helm repo update

      - name: Package Helm Charts
        run: |
          mkdir -p .deploy

          # Find all Chart.yaml files and package each chart
          for chart_file in $(find charts -name 'Chart.yaml' -type f); do
            chart_dir=$(dirname "$chart_file")
            echo "Packaging chart: $chart_dir"

            # Extract category from directory structure (charts/CATEGORY/APP_NAME)
            category=$(echo "$chart_dir" | cut -d'/' -f2)

            # Capitalize first letter of category
            category_display=$(echo "$category" | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')

            # Add category annotation if it doesn't exist
            if ! grep -q "category:" "$chart_file"; then
              echo "Adding category annotation: $category_display"
              # Create a temporary file with the category annotation
              if grep -q "^annotations:" "$chart_file"; then
                # annotations section exists, add to it
                sed -i "/^annotations:/a\  category: \"$category_display\"" "$chart_file"
              else
                # no annotations section, add one before maintainers
                sed -i "/^maintainers:/i annotations:\n  category: \"$category_display\"\n" "$chart_file"
              fi
            fi

            # Build dependencies if Chart.yaml has dependencies
            if grep -q "^dependencies:" "$chart_file"; then
              echo "Building dependencies for $chart_dir"
              helm dependency build "$chart_dir"
            fi

            helm package "$chart_dir" --destination .deploy

            # Revert Chart.yaml changes to avoid committing them
            git checkout "$chart_file" 2>/dev/null || true
          done

      - name: Generate Helm Repository Index
        run: |
          cd .deploy
          helm repo index . --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Create Index Page
        run: |
          # Copy the index.html template
          cp .github/helm-repo-index.html .deploy/index.html

          # Replace placeholders with actual repository information
          sed -i "s|GITHUB_OWNER|${{ github.repository_owner }}|g" .deploy/index.html
          sed -i "s|REPO_NAME|${{ github.event.repository.name }}|g" .deploy/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
