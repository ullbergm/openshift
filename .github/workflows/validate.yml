name: Validate

on:
  workflow_dispatch:
  push:
    branches: ["renovate/**"]

permissions:
  contents: read

jobs:
  validate:
    name: Run repo validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Set up Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Show versions
        run: |
          helm version
          task --version

      - name: Run validation tasks
        run: |
          task validate:all
