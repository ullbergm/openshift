{{- if and .Values.opentakserver .Values.opentakserver.adsb .Values.opentakserver.adsb.enabled }}
{{/*
OpenTAKServer's built-in get_adsb_data job polls {OTS_ADSB_API_URL}/{lat}/{lon}/{radius}
expecting an airplanes.live-v2-style response keyed "ac". The local receiver only serves
readsb-format aircraft.json (key "aircraft") with no point-radius filtering. This ConfigMap
holds a small stdlib-only Python shim that translates between the two.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-adsb-shim
data:
  shim.py: |
    """Translate readsb aircraft.json into the airplanes.live-v2 point-API shape
    that OpenTAKServer's get_adsb_data job expects."""
    import json
    import math
    import os
    import re
    import sys
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlsplit

    UPSTREAM_URL = os.environ.get("UPSTREAM_URL")
    if not UPSTREAM_URL:
        sys.stderr.write("UPSTREAM_URL environment variable is required\n")
        sys.exit(1)

    EARTH_RADIUS_NM = 3440.065
    POINT_RE = re.compile(r"/(-?\d+(?:\.\d+)?)/(-?\d+(?:\.\d+)?)/(-?\d+(?:\.\d+)?)$")


    def haversine_nm(lat1, lon1, lat2, lon2):
        phi1, phi2 = math.radians(lat1), math.radians(lat2)
        dphi = math.radians(lat2 - lat1)
        dlambda = math.radians(lon2 - lon1)
        a = (
            math.sin(dphi / 2) ** 2
            + math.cos(phi1) * math.cos(phi2) * math.sin(dlambda / 2) ** 2
        )
        return 2 * EARTH_RADIUS_NM * math.asin(math.sqrt(a))


    def as_coordinate(value):
        """Return a float if value is a real number (not bool), else None."""
        if isinstance(value, bool):
            return None
        if isinstance(value, (int, float)):
            return float(value)
        return None


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            pass

        def do_GET(self):
            path = urlsplit(self.path).path
            match = POINT_RE.search(path)
            if not match:
                self.send_error(404, "Expected path ending in /{lat}/{lon}/{radius}")
                return

            lat = float(match.group(1))
            lon = float(match.group(2))
            radius = float(match.group(3))

            try:
                with urllib.request.urlopen(UPSTREAM_URL, timeout=5) as resp:
                    data = json.loads(resp.read())
            except Exception as exc:
                self.send_error(502, "Failed to fetch upstream aircraft data: %s" % exc)
                return

            filtered = []
            for ac in data.get("aircraft", []):
                ac_lat = as_coordinate(ac.get("lat"))
                ac_lon = as_coordinate(ac.get("lon"))
                if ac_lat is None or ac_lon is None:
                    continue
                if haversine_nm(lat, lon, ac_lat, ac_lon) <= radius:
                    filtered.append(ac)

            body = json.dumps(
                {
                    "ac": filtered,
                    "msg": "No error",
                    "now": data.get("now"),
                    "total": len(filtered),
                    "ctime": data.get("now"),
                    "ptime": 0,
                }
            ).encode("utf-8")

            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)


    def main():
        server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
        server.serve_forever()


    if __name__ == "__main__":
        main()
{{- end }}
