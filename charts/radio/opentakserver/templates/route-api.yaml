{{- range .Values.application.apiPaths }}
{{- $path := . }}
{{- $slug := $path | trimPrefix "/" | lower }}
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  annotations:
    route.openshift.io/termination: "edge"
  name: {{ $.Release.Name }}-api-{{ $slug }}
spec:
  host: "{{ $.Release.Name }}.apps.{{ $.Values.cluster.name }}.{{ $.Values.cluster.top_level_domain }}"
  path: {{ $path }}
  to:
    kind: Service
    name: {{ $.Release.Name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
