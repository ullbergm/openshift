cluster:
  top_level_domain: example.com
  name: openshift
  admin_email: admin@example.com
  timezone: America/New_York
  #storage:
  #  config:
  #    storageClassName: synology-iscsi

# Cluster passthrough overrides this whole block (cluster/values.yaml config.cloudflare);
# the value is a STRING ('true'/'false'), so gate on {{ eq (toString .Values.cloudflare.enabled) "true" }}.
cloudflare:
  enabled: false
  top_level_domain: example.org

application:
  name: OpenTAKServer
  group: Radio
  icon: mdi:radio-tower
  iconColor: ""
  image: ""
  description: "TAK server for ATAK, iTAK and WinTAK clients"
  port: 8081
  location: 0
  configSize: 25Gi
  apiPaths:
    - /api
    - /Marti
    - /socket.io
    - /ManagedFile
    - /oauth

pods:
  main:
    image:
      # Fork-built image: milsimdk 1.7.11 base + iOS-compatible p12 encryption and
      # socketio-amqp-credentials fixes (ullbergm/OpenTAKServer branch ullberg-1.7.11).
      repository: ghcr.io/ullbergm/opentakserver
      # renovate: datasource=docker depName=ghcr.io/ullbergm/opentakserver versioning=loose
      tag: 1.7.11-ullberg@sha256:adadeb23a7b50509a54f381138bff6c6859b70d74f3b7196d9b1135a84458171
      pullPolicy: IfNotPresent
    # Plaintext CoT (8088) is off by design (threat model T-OTS-01); only the TLS
    # listener (8089) is started and exposed. Set to true to also start eud-handler-tcp.
    tcpStreaming:
      enabled: false
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
    env:
      DOCKER_OTS_DATA_FOLDER: /app/ots
      DOCKER_OTS_LISTENER_PORT: "8081"
      DOCKER_OTS_TCP_STREAMING_PORT: "8088"
      DOCKER_OTS_SSL_STREAMING_PORT: "8089"
      DOCKER_OTS_ENABLE_MESHTASTIC: "true"
      DOCKER_OTS_MESHTASTIC_TOPIC: opentakserver
      DOCKER_OTS_ENABLE_MEDIAMTX: "true"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

  # OTS 1.7 requires PostgreSQL with PostGIS for migrations (SQLite lacks CREATE
  # SEQUENCE support); mirrors upstream milsimdk/ots-docker's ots-db container.
  db:
    image:
      repository: postgis/postgis
      # renovate: datasource=docker depName=postgis/postgis versioning=docker
      tag: 17-3.4-alpine@sha256:5a1dbedac34e0e6663f8b7190d393339571f1cb3ecb2ab2f724524b4f3c7956e
      pullPolicy: IfNotPresent
    database: ots
    user: ots
    size: 10Gi
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      runAsNonRoot: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

  ui:
    image:
      repository: ghcr.io/milsimdk/ots-ui-docker-image
      # renovate: datasource=docker depName=ghcr.io/milsimdk/ots-ui-docker-image versioning=loose
      tag: 1.7.4@sha256:9895cc66f697d99e24d33eb7afa1ab96e40a66d19975d9d60eca1afda9467168
      pullPolicy: IfNotPresent
    containerPort: 80
    securityContext:
      # The ots-ui image bundles nginx which binds :80 and requires root today.
      # Switch to runAsUser/runAsGroup 101 or 8080 if a rootless nginx build ships upstream.
      runAsUser: 0
      runAsGroup: 0
    # The ots-ui image's baked-in nginx proxies to an upstream named "ots"; this alias
    # Service makes that resolve in-cluster without rebuilding the image.
    backendAlias:
      enabled: true
      name: ots
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi

  rabbitmq:
    image:
      repository: rabbitmq
      # renovate: datasource=docker depName=rabbitmq versioning=docker
      tag: 4.3-alpine@sha256:290b4731353a388f75cfdd358f79a3f4925ab3c1e9d23394db635bcb112b3240
      pullPolicy: IfNotPresent
    size: 5Gi
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      runAsNonRoot: true
    # AMQP (5672) and the management plugin stay ClusterIP-only; only MQTT (1883) reaches
    # the LAN VIP for Meshtastic gateways. Credentials come from the ExternalSecret
    # (OTS_RABBITMQ_USERNAME / OTS_RABBITMQ_PASSWORD remote keys).
    config: |-
      loopback_users = none
      mqtt.listeners.tcp.default = 1883
      mqtt.allow_anonymous = false
      mqtt.vhost = /
      mqtt.exchange = amq.topic
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  mediamtx:
    image:
      repository: bluenviron/mediamtx
      # renovate: datasource=docker depName=bluenviron/mediamtx versioning=loose
      tag: 1.20.1-ffmpeg@sha256:16c56911dbd1fd7a85455042fa8320779fc8bf6575c6903f74023b202c1a620c
      pullPolicy: IfNotPresent
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    # OTS is MediaMTX's external auth server (shared secret: OTS_MEDIAMTX_TOKEN); rendered
    # through `tpl` so the release name can be interpolated into authHTTPAddress.
    config: |-
      api: yes
      apiAddress: :9997
      authMethod: http
      authHTTPAddress: http://{{ .Release.Name }}:8081/api/external_auth
      authHTTPExclude:
        - action: api
        - action: metrics
      rtsp: yes
      rtspAddress: :8554
      rtmp: yes
      rtmpAddress: :1935
      hls: yes
      hlsAddress: :8888
      srt: yes
      srtAddress: :8890
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  cloudflared:
    # Second switch: the cluster passes cloudflare.enabled=true globally (plex);
    # the tunnel only activates once OTS_CF_TUNNEL exists in Infisical and this is true.
    enabled: false
    image:
      repository: cloudflare/cloudflared
      # renovate: datasource=docker depName=cloudflare/cloudflared versioning=loose
      tag: 2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

externalSecret:
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteKey: OTS_POSTGRES_PASSWORD
    - secretKey: DOCKER_SECRET_KEY
      remoteKey: OTS_SECRET_KEY
    - secretKey: DOCKER_SECURITY_PASSWORD_SALT
      remoteKey: OTS_SECURITY_PASSWORD_SALT
    - secretKey: DOCKER_OTS_CA_PASSWORD
      remoteKey: OTS_CA_PASSWORD
    - secretKey: DOCKER_OTS_MEDIAMTX_TOKEN
      remoteKey: OTS_MEDIAMTX_TOKEN
    - secretKey: DOCKER_OTS_RABBITMQ_USERNAME
      remoteKey: OTS_RABBITMQ_USERNAME
    - secretKey: DOCKER_OTS_RABBITMQ_PASSWORD
      remoteKey: OTS_RABBITMQ_PASSWORD

opentakserver:
  network:
    ip: ""
  adsb:
    enabled: false
    # readsb/tar1090 aircraft.json of the local receiver
    upstream: http://adsb-ultrafeeder.adsb.svc.cluster.local/data/aircraft.json
    lat: "0.0"
    lon: "0.0"
    # nautical miles
    radius: "25"
