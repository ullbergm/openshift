{{- if ne .Values.pods.planewatch.enabled false }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-planewatch
spec:
  type: ClusterIP
  ports:
    - name: mlat-beast-output
      port: 30105
      targetPort: 30105
      protocol: TCP
  selector:
    app.kubernetes.io/controller: planewatch
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
{{- end }}
