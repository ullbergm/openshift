apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-flightradar24
  labels:
    kasten/backup: "true"
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: flightradar24
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  serviceName: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/controller: flightradar24
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      enableServiceLinks: false
      # fr24feed's own resolver gives up after a few milliseconds. With the
      # default ndots:5 it walks every search domain first (two of them go
      # to the home DNS), times out, and never connects: from Oct 15 to 25
      # it fed only 7-37 min a day. ndots:1 looks public names up directly.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsUser: 0
      containers:
        - name: flightradar24
          env:
          - name: TZ
            value: {{ .Values.cluster.timezone }}
          {{- range $key, $value := .Values.pods.flightradar24.env }}
          - name: {{ $key }}
            value: "{{ $value }}"
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}
          image: {{ .Values.pods.flightradar24.image.repository }}:{{ .Values.pods.flightradar24.image.tag }}
          imagePullPolicy: IfNotPresent
