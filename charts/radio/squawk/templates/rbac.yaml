# From ullbergm/squawk config/rbac (role.yaml is controller-gen output).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: squawk-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-squawk-manager-role
rules:
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # Vendor Feeds' logRegex status reader: the client container's log,
  # read-only (only match times are kept).
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, patch, update, watch]
  # The Hub's aircraft-database CronJob and first build (spec.database);
  # watched even when it is off.
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes, routes/custom-host]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [squawk.ullberg.io]
    resources: [feeds, hubs, receivers, sites]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [squawk.ullberg.io]
    resources: [feeds/status, hubs/status, receivers/status, sites/status]
    verbs: [get, patch, update]
  # OwnerReferencesPermissionEnforcement: blockOwnerDeletion needs this.
  - apiGroups: [squawk.ullberg.io]
    resources: [feeds/finalizers, hubs/finalizers, receivers/finalizers]
    verbs: [update]
---
# A RoleBinding: the operator's rights apply only in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squawk-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-squawk-manager-role
subjects:
  - kind: ServiceAccount
    name: squawk-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squawk-leader-election
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squawk-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: squawk-leader-election
subjects:
  - kind: ServiceAccount
    name: squawk-operator
    namespace: {{ .Release.Namespace }}
---
# FeedTypes are cluster-scoped: reading them needs a ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-squawk-feedtype-reader
rules:
  - apiGroups: [squawk.ullberg.io]
    resources: [feedtypes]
    verbs: [get, list, watch]
  # FeedType status (Valid: do a vendor FeedType's expressions compile).
  - apiGroups: [squawk.ullberg.io]
    resources: [feedtypes/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-squawk-feedtype-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-squawk-feedtype-reader
subjects:
  - kind: ServiceAccount
    name: squawk-operator
    namespace: {{ .Release.Namespace }}
