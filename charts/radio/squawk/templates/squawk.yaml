# The squawk objects. Argo applies them after the CRDs (sync wave).
apiVersion: squawk.ullberg.io/v1alpha1
kind: Site
metadata:
  name: home
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  locationRef:
    name: {{ .Release.Name }}
---
# The existing ultrafeeder, read as a decoding box. squawk is just one
# more client on its beast port; nothing in the adsb namespace changes.
apiVersion: squawk.ullberg.io/v1alpha1
kind: Receiver
metadata:
  name: ultrafeeder
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  siteRef: {name: home}
  hubRef: {name: main}
  band: ADSB1090
  source:
    network:
      host: {{ .Values.source.host }}
      port: {{ .Values.source.port }}
      protocol: beast
  # Feeds run mlat-client against this receiver's own beast stream.
  mlat:
    enabled: true
    clock: auto
{{- if .Values.uat.rawPort }}
---
# dump978's raw UAT, read as a decoding box: the UAT relay piaware needs.
apiVersion: squawk.ullberg.io/v1alpha1
kind: Receiver
metadata:
  name: dump978
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  siteRef: {name: home}
  hubRef: {name: main}
  band: UAT978
  source:
    network:
      host: {{ .Values.uat.host }}
      port: {{ .Values.uat.rawPort }}
      protocol: uat
{{- end }}
{{- with .Values.usb.uat }}
---
# The 978 MHz dongle, decoded by squawk's own dump978-fa (with skyaware978
# for the Hub's UAT marking). The device resource puts it on its node.
apiVersion: squawk.ullberg.io/v1alpha1
kind: Receiver
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  siteRef: {name: home}
  hubRef: {name: main}
  band: UAT978
  source:
    usb:
      resource: {{ .resource }}
      serial: {{ .serial | quote }}
      gain: {{ .gain | quote }}
      ppm: {{ .ppm }}
{{- end }}
---
apiVersion: squawk.ullberg.io/v1alpha1
kind: Hub
metadata:
  name: main
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  siteRef: {name: home}
  tar1090:
    route: true
    host: squawk-tar1090.apps.{{ .Values.cluster.name }}.{{ .Values.cluster.top_level_domain }}
    pageTitle: {{ .Values.hub.pageTitle | quote }}
    rangeRings: {{ .Values.hub.rangeRings | toJson }}
  ui:
    enabled: {{ .Values.hub.ui.enabled }}
    host: squawk.apps.{{ .Values.cluster.name }}.{{ .Values.cluster.top_level_domain }}
  {{- with .Values.hub.storage }}
  storage:
    size: {{ .size }}
    historyDays: {{ .historyDays }}
  {{- end }}
  database:
    enabled: {{ .Values.hub.database.enabled }}
    schedule: {{ .Values.hub.database.schedule | quote }}
    size: {{ .Values.hub.database.size }}
    flagOverlay: {{ .Values.hub.database.flagOverlay | quote }}
    ownerNames: {{ .Values.hub.database.ownerNames | default "companies" | quote }}
  overlays:
    tfr:
      enabled: {{ (((.Values.hub.overlays).tfr).enabled) | default false }}
  {{- with .Values.hub.charts }}
  charts:
    enabled: {{ .enabled }}
    radiusNm: {{ .radiusNm | default 400 }}
    {{- with .coverage }}
    coverage: {{ . }}
    {{- end }}
    {{- with .types }}
    types: {{ toJson . }}
    {{- end }}
  {{- end }}
  {{- with .Values.hub.external }}
  external:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.uat.url }}
  uat:
    aircraftJsonURL: {{ . | quote }}
  {{- end }}
