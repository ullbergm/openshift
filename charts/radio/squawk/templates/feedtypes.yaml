# Built-in FeedTypes, copied from ullbergm/squawk config/feedtypes@379d43e.
# Cluster-scoped; applied after the CRDs.
---
apiVersion: squawk.ullberg.io/v1alpha1
kind: FeedType
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: adsbexchange
spec:
  displayName: ADSBexchange
  aggregator:
    host: feed1.adsbexchange.com
    port: 30004
    mlat:
      host: feed.adsbexchange.com
      port: 31090
  egress:
    - host: feed1.adsbexchange.com
      ports: [30004]
    - host: feed.adsbexchange.com
      ports: [31090]
    - host: adsbexchange.com
      ports: [443]
  statusURL: https://www.adsbexchange.com/myip/
  # Their stats package, posted by the Feed agent (from ullbergm/squawk
  # config/feedtypes/aggregators.yaml@51d1df9).
  stats:
    url: https://adsbexchange.com/api/receive/
    format: adsbexchange
---
apiVersion: squawk.ullberg.io/v1alpha1
kind: FeedType
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: adsb-lol
spec:
  displayName: adsb.lol
  aggregator:
    host: in.adsb.lol
    port: 30004
    mlat:
      host: in.adsb.lol
      port: 31090
  egress:
    - host: in.adsb.lol
      ports: [30004]
    - host: in.adsb.lol
      ports: [31090]
  statusURL: https://my.adsb.lol/
  public:
    url: https://api.adsb.lol/0/me
    interval: 5m
    online: >-
      data.clients.beast.exists(c, id != "" && id.startsWith(c.uuid.split("...")[0]))
    messagesPerSecond: >-
      data.clients.beast.exists(c, id != "" && id.startsWith(c.uuid.split("...")[0]))
      ? data.clients.beast.filter(c, id.startsWith(c.uuid.split("...")[0]))[0].messages_per_second
      : null
    mlatPeers: >-
      data.clients.mlat.exists(c, id != "" && id.startsWith(c.uuid.split("...")[0]))
      ? data.clients.mlat.filter(c, id.startsWith(c.uuid.split("...")[0]))[0].peer_count
      : null
    link: >-
      data.clients.beast.exists(c, id != "" && id.startsWith(c.uuid.split("...")[0]))
      ? data.clients.beast.filter(c, id.startsWith(c.uuid.split("...")[0]))[0].adsblol_my_url
      : ""
    notice: >-
      has(data._motd) ? data._motd.join(" ") : ""
---
