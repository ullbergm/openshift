# ADSBHub, squawk's own relay (from ullbergm/squawk config/feedtypes/adsbhub.yaml@ea8cc3a,
# the image pinned to the squawk image this chart deploys).
apiVersion: squawk.ullberg.io/v1alpha1
kind: FeedType
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: adsbhub
spec:
  displayName: ADSBHub
  vendor:
    image: {{ .Values.images.operator.repository }}:{{ .Values.images.operator.tag }}
    command: [/squawk-adsbhub]
    args: [--input, "$(INPUT_SBS_HOST):$(INPUT_SBS_PORT)", --listen, ":9100"]
    inputs:
      - {name: sbs, from: hub, protocol: sbs}
    credentials:
      - {key: ckey, env: ADSBHUB_CKEY}
    ports:
      - {name: metrics, port: 9100}
    status:
      reader:
        prometheus: {port: 9100, path: /metrics}
      connected: "data.adsbhub_upstream_connected == 1.0"
      receiving: "data.adsbhub_bytes_sent_total > prev.data.adsbhub_bytes_sent_total"
      message: "data.adsbhub_input_connected == 1.0 ? '' : 'no SBS from the Hub'"
  egress:
    - {host: data.adsbhub.org, ports: [5001]}
    - {host: ip4.adsbhub.org, ports: [443]}
    - {host: ip6.adsbhub.org, ports: [443]}
    - {host: www.adsbhub.org, ports: [443]}
---
# Plane Finder's pfclient (from ullbergm/squawk config/feedtypes/planefinder.yaml@ca1ef87,
# the image pinned to the private squawk-planefinder this chart deploys).
apiVersion: squawk.ullberg.io/v1alpha1
kind: FeedType
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: planefinder
spec:
  displayName: Plane Finder
  vendor:
    image: {{ .Values.images.planefinder.repository }}:{{ .Values.images.planefinder.tag }}
    command: [/usr/local/bin/pfclient]
    args:
      - --connection_type=1
      - --address=$(INPUT_BEAST_HOST)
      - --port=$(INPUT_BEAST_PORT)
      - --data_format=1
      - --sharecode=$(PF_SHARECODE)
      - --lat=$(SQUAWK_LAT)
      - --lon=$(SQUAWK_LON)
      - --pid_file=/run/pfclient/pfclient.pid
      - --config_path=/run/pfclient/pfclient-config.json
      - --log_path=/run/pfclient
    inputs:
      - {name: beast, from: hub, protocol: beast}
    credentials:
      - {key: sharecode, env: PF_SHARECODE, required: true}
    writablePaths: [/run/pfclient]
    ports:
      - {name: web, port: 30053}
    status:
      reader:
        httpJSON: {port: 30053, path: /ajax/stats}
      connected: >-
        data.master_server_bytes_in > 0 &&
        data.master_server_bytes_out > prev.data.master_server_bytes_out
      receiving: >-
        data.receiver_bytes_in > prev.data.receiver_bytes_in &&
        data.master_server_bytes_out > prev.data.master_server_bytes_out
      message: >-
        data.master_server_bytes_in == 0 ? 'no answer from Plane Finder yet' :
        data.receiver_bytes_in == 0 ? 'no Beast from the Hub yet' :
        string(data.total_modes_packets_ps) + ' Mode S messages/s'
  # pfclient syncs to its own NTP pool (UDP 123) before it uploads anything.
  egress:
    - {host: pfclient-upload.planefinder.net, ports: [80]}
    - {host: 0.planefinder.pool.ntp.org, ports: [123], protocol: UDP}
    - {host: 1.planefinder.pool.ntp.org, ports: [123], protocol: UDP}
    - {host: 2.planefinder.pool.ntp.org, ports: [123], protocol: UDP}
    - {host: 3.planefinder.pool.ntp.org, ports: [123], protocol: UDP}
  statusURL: https://planefinder.net/
---
# Flightradar24's fr24feed (from ullbergm/squawk config/feedtypes/fr24.yaml@b704729,
# the image pinned to the private squawk-fr24feed this chart deploys).
apiVersion: squawk.ullberg.io/v1alpha1
kind: FeedType
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: fr24
spec:
  displayName: Flightradar24
  vendor:
    image: {{ .Values.images.fr24feed.repository }}:{{ .Values.images.fr24feed.tag }}
    # sdr-enthusiasts work around a CPU-burning fcntl loop over open fds
    # with a small fd table; lowering a soft limit needs no privilege.
    command: [/bin/sh, -c]
    args:
      - ulimit -n 128 2>/dev/null; exec /usr/local/bin/fr24feed --config-file=/config/fr24feed.ini --monitor-file=/run/fr24/decoder.txt
    inputs:
      - {name: beast, from: hub, protocol: beast}
    credentials:
      - {key: fr24key, env: FR24KEY, required: true}
    env:
      - {name: TZ, value: UTC}
    files:
      - path: /config/fr24feed.ini
        template: |
          receiver="beast-tcp"
          fr24key="{{`{{ .Credentials.fr24key }}`}}"
          host="{{`{{ .Inputs.beast.Addr }}`}}"
          bs="no"
          raw="no"
          logmode="0"
          mlat="no"
          mlat-without-gps="no"
    writablePaths: [/run/fr24, /tmp]
    ports:
      - {name: web, port: 8754}
    status:
      reader:
        httpJSON: {port: 8754, path: /monitor.json}
      # monitor.json holds strings, and until fr24feed has its FR24
      # configuration (after its NTP check) it lacks the feed_* keys.
      connected: "'feed_status' in data && data.feed_status == 'connected'"
      receiving: >-
        'rx_connected' in data && data.rx_connected == '1' &&
        'num_messages' in data && 'num_messages' in prev.data &&
        int(data.num_messages) > int(prev.data.num_messages)
      # 1.0.48 has no mlat-ok key at all; absent reads as not synced.
      mlatSynced: "'mlat-ok' in data && data['mlat-ok'] == 'YES'"
      message: >-
        !('feed_status' in data) ? 'no FR24 configuration yet (time check or login)' :
        data.feed_status != 'connected' ?
        ('feed ' + data.feed_status + ('feed_status_message' in data && data.feed_status_message != '' ? ': ' + data.feed_status_message : '')) :
        ('feed_num_ac_tracked' in data ? data.feed_num_ac_tracked + ' aircraft tracked' : '')
  # Where fr24feed connects (vendor-clients §3). The feed server is assigned
  # at login (monitor.json feed_current_server) and takes TCP and UDP 8099;
  # MLAT goes to mlat-9.fr24.com on ports it picks; NTP (UDP 123) for its
  # time check. Exact hosts for the last two: record them from the live Pod.
  egress:
    - {host: feed.flightradar24.com, ports: [443, 80]}
    - {host: mlat-9.fr24.com}
    - {host: mlat-9.fr24.com, protocol: UDP}
  statusURL: https://www.flightradar24.com/account/data-sharing
---
# FlightAware's piaware (from ullbergm/squawk config/feedtypes/piaware.yaml@1563a41,
# the image pinned to the private squawk-piaware this chart deploys).
apiVersion: squawk.ullberg.io/v1alpha1
kind: FeedType
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: piaware
spec:
  displayName: FlightAware
  vendor:
    image: {{ .Values.images.piaware.repository }}:{{ .Values.images.piaware.tag }}
    command: [/usr/bin/piaware]
    args: [-plainlog, -configfile, /config/piaware.conf, -cachedir, /cache, -statusfile, /run/piaware/status.json]
    inputs:
      - {name: beast, from: receiver, protocol: beast}
      - {name: uat, from: receiver, protocol: uatRaw}
    credentials:
      - {key: feederId, env: PIAWARE_FEEDER_ID, required: true}
    files:
      - path: /config/piaware.conf
        template: |
          feeder-id {{`{{ .Credentials.feederId }}`}}
          receiver-type other
          receiver-host {{`{{ .Inputs.beast.Host }}`}}
          receiver-port {{`{{ .Inputs.beast.Port }}`}}
          uat-receiver-type other
          uat-receiver-host {{`{{ .Inputs.uat.Host }}`}}
          uat-receiver-port {{`{{ .Inputs.uat.Port }}`}}
          allow-auto-updates no
          allow-manual-updates no
          allow-mlat yes
          mlat-results yes
          mlat-results-format "beast,connect,{{`{{ .Hub.MlatIn }}`}}"
    mlatResults: hub
    writablePaths: [/run/piaware, /cache, /tmp]
    status:
      reader:
        jsonFile: {path: /run/piaware/status.json}
      interval: 15s
      # status.json is rewritten every 5 s; each part is {status, message}.
      connected: "'adept' in data && data.adept.status == 'green'"
      # The streak signal: Mode S data reaching piaware.
      receiving: "'radio' in data && data.radio.status == 'green'"
      mlatSynced: "'mlat' in data && data.mlat.status == 'green'"
      message: >-
        ('piaware_version' in data ? 'PiAware ' + data.piaware_version + '; ' : '') +
        ('adept' in data ? data.adept.message : 'no status yet') +
        ('uat_radio' in data ? '; UAT ' + data.uat_radio.status : '')
  # Where piaware connects (vendor-clients §2): adept over TLS 1.3 on 1200,
  # with fallback addresses in FlightAware's two /24s; MLAT over UDP to a
  # port the server assigns in the same ranges.
  egress:
    - {host: piaware.flightaware.com, ports: [1200]}
    - {host: 206.253.80.0/24}
    - {host: 206.253.80.0/24, protocol: UDP}
    - {host: 206.253.84.0/24}
    - {host: 206.253.84.0/24, protocol: UDP}
  statusURL: https://flightaware.com/adsb/stats/
