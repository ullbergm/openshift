apiVersion: squawk.ullberg.io/v1alpha1
kind: FeedType
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: airplanes-live
spec:
  displayName: airplanes.live
  aggregator:
    host: feed.airplanes.live
    port: 30004
    mlat:
      host: feed.airplanes.live
      port: 31090
  egress:
    - host: feed.airplanes.live
      ports: [30004]
    - host: feed.airplanes.live
      ports: [31090]
  statusURL: https://airplanes.live/myfeed/
  public:
    url: https://api.airplanes.live/feed-status
    interval: 5m
    online: >-
      data.beast_clients.exists(c, id != "" && c.uuid == id)
    messagesPerSecond: >-
      data.beast_clients.exists(c, id != "" && c.uuid == id)
      ? data.beast_clients.filter(c, c.uuid == id)[0].msgs_s
      : null
    mlatPeers: >-
      data.mlat_clients.exists(c, id != "" && c.uuid == id)
      ? data.mlat_clients.filter(c, c.uuid == id)[0].peer_count
      : null
    notice: >-
      data.mlat_clients.exists(c, id != "" && c.uuid == id && c.bad_sync_timeout > 0)
      ? "MLAT: the server reports a bad-sync timeout for this station"
      : ""
