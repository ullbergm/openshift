# The Hub and any decoder Pods may only reach DNS, the ultrafeeder beast
# port, dump978's web port (UAT marking) and this namespace: no internet,
# so nothing can be fed anywhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squawk-workloads
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [hub, receiver]
  policyTypes: [Ingress, Egress]
  ingress:
    # The operator (status) and other squawk Pods.
    - from:
        - podSelector: {}
    # The OpenShift router, for the tar1090 Route.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - {port: 5353, protocol: UDP}
        - {port: 5353, protocol: TCP}
{{- if .Values.source.host }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.source.namespace }}
          podSelector:
            matchLabels:
{{ .Values.source.podSelector | toYaml | indent 14 }}
      ports:
        - port: {{ .Values.source.port }}
          protocol: TCP
{{- end }}
{{- if .Values.uat.url }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.uat.namespace }}
          podSelector:
            matchLabels:
{{ .Values.uat.podSelector | toYaml | indent 14 }}
      ports:
        - port: {{ .Values.uat.port }}
          protocol: TCP
        {{- if .Values.uat.rawPort }}
        - port: {{ .Values.uat.rawPort }}
          protocol: TCP
        {{- end }}
{{- end }}
---
# squawk's web map: the router may reach it, and it may reach only the
# Hub's agent (its /api/ proxy), the operator's feed board API and DNS.
# Map tiles are fetched by the browser, not by this Pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squawk-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: hub-ui
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub
      ports:
        - port: 8090
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: squawk
              app.kubernetes.io/component: operator
      ports:
        - port: 8082
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - {port: 5353, protocol: UDP}
        - {port: 5353, protocol: TCP}
