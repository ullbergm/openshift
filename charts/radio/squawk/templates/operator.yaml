{{- $img := .Values.images }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squawk-operator
  labels:
    app.kubernetes.io/name: squawk
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: squawk
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squawk
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: squawk-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ $img.operator.repository }}:{{ $img.operator.tag }}
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SQUAWK_AGENT_IMAGE
              value: {{ $img.operator.repository }}:{{ $img.operator.tag }}
            - name: SQUAWK_READSB_IMAGE
              value: {{ $img.readsb.repository }}:{{ $img.readsb.tag }}
            - name: SQUAWK_DUMP978_IMAGE
              value: {{ $img.dump978.repository }}:{{ $img.dump978.tag }}
            - name: SQUAWK_MLAT_CLIENT_IMAGE
              value: {{ $img.mlatClient.repository }}:{{ $img.mlatClient.tag }}
            - name: SQUAWK_TAR1090_IMAGE
              value: {{ $img.tar1090.repository }}:{{ $img.tar1090.tag }}
            - name: SQUAWK_SPA_IMAGE
              value: {{ $img.spa.repository }}:{{ $img.spa.tag }}
            - name: SQUAWK_IMAGE_PULL_POLICY
              value: IfNotPresent
          ports:
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
