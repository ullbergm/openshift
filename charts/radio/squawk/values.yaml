cluster:
  top_level_domain: example.com
  name: openshift

application:
  group: ADSB
  iconColor: ''

# squawk runs beside charts/radio/adsb as a trial. It reads the existing
# ultrafeeder's beast output as a network Receiver and serves its own
# tar1090. It has no Feeds: nothing is sent to any aggregator, and the
# NetworkPolicy keeps the Hub from reaching the internet at all.
images:
  operator:
    repository: ghcr.io/ullbergm/squawk
    tag: 0.1.0-g51d1df9-1@sha256:cfc306871e200935cce764220c0d1470502921085d6cc65cbee31d89ab1756c2
  # squawk's own web map (same commit as the operator).
  spa:
    repository: ghcr.io/ullbergm/squawk-spa
    tag: 0.1.0-gdb56abc-1@sha256:b92e2eb9a64ea05dce9ee329e79fee6c622a23f085aab3fc6d882fbbd77bd787
  # The FAA chart tiles job (official GDAL image plus squawk-charts).
  charts:
    repository: ghcr.io/ullbergm/squawk-charts
    tag: 0.1.0-gca1ef87-1@sha256:a65c8db303ab0cdd3c03978c72559cc83d2444aebf3bb030a679a1fc804e6fcc
  readsb:
    repository: ghcr.io/ullbergm/squawk-readsb
    tag: v3.16.18-3@sha256:9225ec29c727091a817e7d3c5c767daf697376b2a5216840bcc481ee49d1b436
  dump978:
    repository: ghcr.io/ullbergm/squawk-dump978
    tag: v11.1-2@sha256:bd4cf6471b62a3dea8b1e5a04835a8ade60224a4928a4dae1c06b5bbd1486eb4
  mlatClient:
    repository: ghcr.io/ullbergm/squawk-mlat-client
    tag: v0.4.2-g28ae4f7-2@sha256:51369d2a3b89ad941763e365eae6ef2cbed997a5f679942c6b57d6d65cb03f57
  tar1090:
    repository: ghcr.io/ullbergm/squawk-tar1090
    tag: g958e60e-1@sha256:e8dffa5133858ea2bd32af6f9c1f2e2c4218b36a13fdccdf095fa5847262895e
  # Plane Finder's pfclient 5.3.2 (private package: pfclient is not
  # redistributable).
  planefinder:
    repository: ghcr.io/ullbergm/squawk-planefinder
    tag: 5.3.2-1@sha256:7155054feb1f4a6518538d2ee55d94ee2fe78cbfb39983407e27d5194444322f

# The old chart's ultrafeeder, read-only: squawk is one more beast client.
source:
  namespace: adsb
  host: adsb-ultrafeeder.adsb.svc.cluster.local
  port: 30005
  podSelector:
    app.kubernetes.io/controller: ultrafeeder

# The old chart's dump978, read-only: the Hub's agent polls its aircraft
# list to mark UAT aircraft on squawk's map. Empty url: no UAT marking.
uat:
  url: http://adsb-dump978.adsb.svc.cluster.local/skyaware978/data/aircraft.json
  namespace: adsb
  port: 80
  podSelector:
    app.kubernetes.io/controller: dump978

hub:
  pageTitle: squawk
  rangeRings: [50, 100, 150, 200]
  # squawk's own map beside tar1090, on its own Route.
  ui:
    enabled: true
  # The Hub's state volume: readsb's globe history and heatmaps, kept
  # historyDays (pruned hourly), and the station graphs (up to a year) and
  # all-time range outline across restarts. Unset: an emptyDir.
  storage:
    size: 50Gi
    historyDays: 365
  # squawk's own aircraft database, built weekly in the cluster onto its
  # own volume (docs/DECISIONS.md "Own aircraft database"), 20 Gi to leave
  # room for the chart tiles (two cycles side by side at a rollover). Off: readsb
  # uses the database bundled in its image. flagOverlay "tar1090-db" also
  # copies that file's PIA/LADD flags at run time (opt-in). ownerNames
  # "all" includes private owners' names: this is a private station whose
  # map no one outside sees; the default is "companies".
  database:
    enabled: true
    schedule: "23 4 * * 1"
    size: 20Gi
    flagOverlay: tar1090-db
    ownerNames: all
  # Map overlays the Hub's agent fetches. tfr: the FAA's temporary flight
  # restrictions (US only), every 5 min; the operator then gives the Hub
  # Pod egress to DNS and public HTTPS (a NetworkPolicy can't name the
  # FAA host). Weather and basemap tiles come from the viewer's browser.
  overlays:
    tfr:
      enabled: true
  # Sources the Hub's agent looks up on demand (squawk SPEC-phase7). photos:
  # Planespotters.net, one lookup per aircraft opened, cached, at most
  # dailyCalls a day; each viewer also turns photos on in the map's
  # Settings. aeroapi (flight details) stays off until there is a key.
  external:
    photos:
      enabled: true   # user decision 2026-10-27
  # FAA charts (sectionals, terminal areas, Caribbean, IFR enroute low
  # with its area charts, and high), built daily
  # onto the data volume when a new 56-day cycle is out, plus the airspace
  # overlay. coverage all: every sheet squawk has a cut for (CONUS about
  # 1.1 GB); radius: within radiusNm of the station. Needs the database
  # (its volume).
  charts:
    enabled: true
    coverage: all
    types: [sectional, tac, caribbean, ifrLow, ifrHigh]
    radiusNm: 400

# Aggregator feeds. They stay suspended (no Pod, nothing sent) until each
# one is moved off ultrafeeder: the same UUID must never feed from two
# places. Each gets its own Secret from the same store keys ultrafeeder
# uses today, so the aggregators keep the station's history.
feeds:
  - name: adsbexchange
    type: adsbexchange
    suspend: false   # moved off ultrafeeder 2026-10-26
  - name: adsb-lol
    type: adsb-lol
    suspend: false   # moved off ultrafeeder 2026-10-26
  - name: adsb-fi
    type: adsb-fi
    suspend: true    # stopped feeding 2026-10-27 (user decision); kept to come back
  # airplanes.live (new 2026-10-27; not fed by the adsb chart before).
  - name: airplanes-live
    type: airplanes-live
    suspend: false
  # ADSBHub (M3 step 1): squawk's relay.
  - name: adsbhub
    type: adsbhub
    suspend: true    # stopped feeding 2026-10-27 (user decision); kept to come back
    mlat: false
    credentials:
      - secretKey: ckey
        remoteKey: ADSBHUB_CLIENTKEY
  # Plane Finder (M3): pfclient as a vendor Feed; the share code keeps the
  # station's Plane Finder history.
  - name: planefinder
    type: planefinder
    suspend: false
    # The station's receiver page (public; shown on the feed board).
    statusURL: https://planefinder.net/coverage/receiver/238534
    mlat: false
    credentials:
      - secretKey: sharecode
        remoteKey: PLANEFINDER_SHARE_CODE
feedSecret:
  uuidKey: ULTRAFEEDER_UUID
  mlatUserKey: MLAT_USER

# The site position, from the same store keys the adsb chart uses.
externalSecret:
  data:
    - secretKey: lat
      remoteKey: LAT
    - secretKey: lon
      remoteKey: LONG
    - secretKey: altMeters
      remoteKey: ALT
