    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Hub merges every Receiver's messages and MLAT results, serves tar1090 and
          the streams that Feeds read.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'HubSpec is the merge point: readsb in network-only mode
              plus tar1090.'
            properties:
              siteRef:
                description: |-
                  SiteRef names the Site. Its position centres the map and the range
                  outline.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              storage:
                description: |-
                  Storage keeps readsb's state, range outline, heatmaps and globe
                  history across restarts. Without it they live in an emptyDir.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 2Gi
                    description: Size of the PVC.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: StorageClassName of the PVC; empty uses the cluster
                      default.
                    type: string
                type: object
              tar1090:
                description: Tar1090 settings for the web UI.
                properties:
                  host:
                    description: |-
                      Host is the Route's hostname, e.g. "squawk.apps.example.com". Empty
                      lets the router assign one (hub-<name>-<namespace>.apps...).
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  pageTitle:
                    description: PageTitle is the browser tab title.
                    type: string
                  rangeRings:
                    description: RangeRings are the distances of the range rings,
                      in nautical miles.
                    items:
                      format: int32
                      type: integer
                    type: array
                  route:
                    description: Route exposes the UI with an OpenShift Route (ignored
                      elsewhere).
                    type: boolean
                type: object
            required:
            - siteRef
            type: object
          status:
            description: HubStatus is the observed state of a Hub.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is where Feeds read the merged beast stream.
                properties:
                  host:
                    type: string
                  port:
                    format: int32
                    type: integer
                  protocol:
                    description: Protocol is a wire format a Receiver serves and the
                      Hub reads.
                    enum:
                    - beast
                    - raw
                    - sbs
                    - uat
                    - asterix
                    type: string
                required:
                - host
                - port
                - protocol
                type: object
              observedGeneration:
                format: int64
                type: integer
              receivers:
                description: Receivers is the number of Receivers the Hub connects
                  to.
                format: int32
                type: integer
              stats:
                description: Summary of readsb's statistics, refreshed at most once
                  a minute.
                properties:
                  aircraft:
                    description: Aircraft currently tracked with a position.
                    format: int32
                    type: integer
                  messagesPerSecond:
                    description: MessagesPerSecond over the last minute.
                    format: int64
                    type: integer
                  mlatAircraft:
                    description: MlatAircraft currently positioned by MLAT.
                    format: int32
                    type: integer
                  updatedAt:
                    description: UpdatedAt is when this summary was taken.
                    format: date-time
                    type: string
                type: object
