  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: receivers.squawk.ullberg.io
spec:
  group: squawk.ullberg.io
  names:
    kind: Receiver
    listKind: ReceiverList
    plural: receivers
    shortNames:
    - rx
    singular: receiver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.band
      name: Band
      type: string
    - jsonPath: .spec.hubRef.name
      name: Hub
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Receiving')].status
      name: Receiving
