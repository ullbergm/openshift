    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Receiver is one source of messages for one band: a dongle on a node, or
          a box on the network.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReceiverSpec is one source of messages for one band.
            properties:
              band:
                description: Band is the frequency band.
                enum:
                - ADSB1090
                - UAT978
                type: string
              hubRef:
                description: HubRef names the Hub this Receiver feeds.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              locationRef:
                description: |-
                  LocationRef overrides the Site's position for this antenna, for a
                  networked box somewhere else. MLAT needs each antenna's own position.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              mlat:
                description: |-
                  MLAT settings. Feeds run mlat-client against this Receiver only when
                  enabled.
                properties:
                  clock:
                    default: auto
                    description: Clock is mlat-client's --input-type for this source.
                    enum:
                    - auto
                    - beast
                    - dump1090
                    - radarcape_gps
                    - radarcape_12mhz
                    type: string
                  enabled:
                    description: Enabled lets MLAT-capable Feeds run an mlat-client
                      for this Receiver.
                    type: boolean
                type: object
              siteRef:
                description: SiteRef names the Site the antenna is at.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              source:
                description: Source says where the messages come from.
                properties:
                  iq:
                    description: |-
                      IQ is a raw-IQ server (rtl_tcp, SoapyRemote). Experimental; not
                      implemented yet.
                    properties:
                      soapy:
                        description: |-
                          Soapy is the SoapySDR device string, e.g.
                          "driver=remote,remote=192.0.2.20".
                        minLength: 1
                        type: string
                    required:
                    - soapy
                    type: object
                  network:
                    description: |-
                      Network is a box that decodes itself and serves messages over TCP.
                      No decoder Pod runs.
                    properties:
                      host:
                        description: Host is the box's address (pull mode).
                        minLength: 1
                        type: string
                      mode:
                        default: pull
                        description: Mode says who connects. Only pull is implemented
                          so far.
                        enum:
                        - pull
                        - push
                        type: string
                      port:
                        description: Port is the TCP port the box serves on (pull
                          mode).
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      protocol:
                        default: beast
                        description: Protocol is what the box serves.
                        enum:
                        - beast
                        - raw
                        - sbs
                        - uat
                        - asterix
                        type: string
                    required:
                    - host
                    - port
                    type: object
                  usb:
                    description: |-
                      USB is an RTL-SDR on a cluster node, handed to the decoder Pod by a
                      device plugin.
                    properties:
                      biasTee:
                        description: BiasTee powers an LNA through the coax. 1090
                          only.
                        type: boolean
                      gain:
                        default: auto
                        description: |-
                          Gain is "auto" (the decoder's automatic gain) or a gain in dB such as
                          "49.6". Default "auto".
                        pattern: ^(auto|[0-9]+(\.[0-9]+)?)$
                        type: string
                      ppm:
                        description: PPM is the frequency correction in parts per
                          million.
                        format: int32
                        maximum: 200
                        minimum: -200
                        type: integer
                      resource:
                        description: |-
                          Resource is the extended resource the device plugin advertises for
                          this dongle, e.g. "devic.es/adsb1090".
                        minLength: 1
                        type: string
                      serial:
                        description: |-
                          Serial selects the dongle by serial number. With a device plugin only
                          one dongle is visible, so this is optional.
                        type: string
                    required:
                    - resource
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of usb, network or iq
                  rule: '[has(self.usb), has(self.network), has(self.iq)].filter(x,
                    x).size() == 1'
            required:
            - band
            - hubRef
            - siteRef
            - source
            type: object
            x-kubernetes-validations:
            - message: MLAT is only available on 1090 MHz
              rule: self.band == 'ADSB1090' || !has(self.mlat) || !self.mlat.enabled
            - message: MLAT needs a beast source with receiver timestamps
              rule: '!has(self.source.network) || !has(self.mlat) || !self.mlat.enabled
                || self.source.network.protocol == ''beast'''
            - message: UAT978 network receivers use protocol uat, and only they do
              rule: '!has(self.source.network) || (self.band == ''UAT978'') == (self.source.network.protocol
                == ''uat'')'
          status:
            description: ReceiverStatus is the observed state of a Receiver.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: |-
                  Endpoint is where the Hub, and mlat-clients, read this Receiver's
                  messages.
                properties:
                  host:
                    type: string
                  port:
                    format: int32
                    type: integer
                  protocol:
                    description: Protocol is a wire format a Receiver serves and the
                      Hub reads.
                    enum:
                    - beast
                    - raw
                    - sbs
                    - uat
                    - asterix
                    type: string
                required:
                - host
                - port
                - protocol
                type: object
              mlatCapable:
                description: |-
                  MlatCapable is true when MLAT is enabled and the source carries
                  receiver timestamps.
                type: boolean
              observedGeneration:
                format: int64
                type: integer
              stats:
                description: |-
                  Summary of the decoder's statistics, refreshed at most once a minute.
                  Rates are also exported as Prometheus metrics.
                properties:
                  aircraft:
                    description: Aircraft currently tracked with a position.
                    format: int32
                    type: integer
                  gain:
                    description: Gain in dB, as readsb reports it.
                    type: string
                  maxRangeNm:
                    description: MaxRangeNm is the longest range seen in the last
                      readsb stats period.
                    format: int32
                    type: integer
                  messagesPerSecond:
                    description: MessagesPerSecond over the last minute.
                    format: int64
                    type: integer
                  noiseDbfs:
                    description: NoiseDbfs is the noise floor in dBFS.
                    type: string
                  updatedAt:
                    description: UpdatedAt is when this summary was taken.
                    format: date-time
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
