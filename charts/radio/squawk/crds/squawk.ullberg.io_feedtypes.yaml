# Copied from ullbergm/squawk config/crd/bases@db56abc. Do not edit; regenerate there.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: feedtypes.squawk.ullberg.io
spec:
  group: squawk.ullberg.io
  names:
    kind: FeedType
    listKind: FeedTypeList
    plural: feedtypes
    singular: feedtype
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display
      type: string
    - jsonPath: .spec.aggregator.host
      name: Host
      type: string
    - jsonPath: .spec.aggregator.mlat.host
      name: MLAT
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FeedType is a kind of feed: the plugin a Feed instantiates. Only cluster
          admins create FeedTypes; built-in ones ship with squawk.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FeedTypeSpec describes how to run one kind of feed. Exactly one kind is
              set: aggregator (beast_reduce_plus networks) or vendor (a vendor's own
              client, M3).
            properties:
              aggregator:
                description: |-
                  Aggregator is a network that takes beast_reduce_plus over TCP and runs
                  a wiedehopf mlat-server (ADSBexchange, adsb.lol, adsb.fi, ...).
                properties:
                  host:
                    description: Host and Port take beast_reduce_plus with the feeder's
                      UUID.
                    minLength: 1
                    type: string
                  mlat:
                    description: Mlat is the network's mlat-server, if it has one.
                    properties:
                      host:
                        minLength: 1
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - host
                    - port
                    type: object
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - host
                - port
                type: object
              displayName:
                description: DisplayName is shown in the UI.
                minLength: 1
                type: string
              egress:
                description: |-
                  Egress documents where the feed connects. The operator lets Feed Pods
                  reach the internet but not the cluster or LAN; these hosts are for
                  hostname-based policies where the platform has them.
                items:
                  description: EgressRule is one destination a feed connects to.
                  properties:
                    host:
                      minLength: 1
                      type: string
                    ports:
                      items:
                        format: int32
                        type: integer
                      type: array
                    protocol:
                      default: TCP
                      enum:
                      - TCP
                      - UDP
                      type: string
                  required:
                  - host
                  type: object
                type: array
              public:
                description: |-
                  Public reads what the network itself says about this station, for
                  the feed board (Feed status.network). The Feed Pod's agent reads the
                  URL; the operator maps the reading with CEL.
                properties:
                  aircraft:
                    description: Aircraft (int) the network counts from this station.
                    type: string
                  interval:
                    description: 'Interval between readings: at least 2m (default
                      5m).'
                    type: string
                    x-kubernetes-validations:
                    - message: at least 2m
                      rule: duration(self) >= duration('2m')
                  lastSeen:
                    description: LastSeen (timestamp) by the network.
                    type: string
                  link:
                    description: 'Link (string): the station''s page at the network.'
                    type: string
                  messagesPerSecond:
                    description: MessagesPerSecond (number) the network receives from
                      this station.
                    type: string
                  mlatPeers:
                    description: 'MlatPeers (int): the station''s MLAT peers as the
                      network sees them.'
                    type: string
                  notice:
                    description: 'Notice (string): what the network wants the feeder
                      to know.'
                    type: string
                  online:
                    description: 'Online (bool): the network sees this station''s
                      feed.'
                    type: string
                  rank:
                    description: Rank (int) among the network's feeders.
                    type: string
                  url:
                    maxLength: 512
                    pattern: ^https://[^/@?#]+(/[^@#]*)?$
                    type: string
                required:
                - url
                type: object
              statusURL:
                description: StatusURL is a public page where the feeder can check
                  its feed.
                type: string
              vendor:
                description: Vendor runs a vendor's own feeder client.
                properties:
                  args:
                    items:
                      type: string
                    type: array
                  command:
                    description: Command and Args, with $(ENV) expanded as Kubernetes
                      does.
                    items:
                      type: string
                    type: array
                  credentials:
                    description: 'Credentials: keys of the Feed''s Secret given to
                      the client as env.'
                    items:
                      description: VendorCredential maps a key of the Feed's Secret
                        to an env var.
                      properties:
                        env:
                          pattern: ^[A-Z_][A-Z0-9_]*$
                          type: string
                        key:
                          minLength: 1
                          type: string
                        required:
                          type: boolean
                      required:
                      - env
                      - key
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - key
                    x-kubernetes-list-type: map
                  env:
                    description: Env is plain environment for the client.
                    items:
                      description: VendorEnv is a plain env var.
                      properties:
                        name:
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  files:
                    description: |-
                      Files are rendered by the operator (Go text/template over .Inputs,
                      .Hub, .Site and .Credentials) into a Secret per Feed, mounted
                      read-only. They may hold credentials and the station's position.
                    items:
                      description: VendorFile is a rendered config file.
                      properties:
                        path:
                          pattern: ^/[^\0]+$
                          type: string
                        template:
                          type: string
                      required:
                      - path
                      - template
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - path
                    x-kubernetes-list-type: map
                  image:
                    description: |-
                      Image of the client. FeedTypes are cluster-scoped and only cluster
                      admins create them, as the image receives the Feed's credentials.
                    minLength: 1
                    type: string
                  inputs:
                    description: |-
                      Inputs the client reads; each becomes env INPUT_<NAME>_HOST and
                      INPUT_<NAME>_PORT, and .Inputs.<name>.Host/.Port in file templates.
                    items:
                      description: VendorInput is a data source for the client.
                      properties:
                        from:
                          description: |-
                            From: the Hub's merged stream, or the one Receiver the Feed names (a
                            client doing its own MLAT needs one receiver's timing).
                          enum:
                          - hub
                          - receiver
                          type: string
                        name:
                          pattern: ^[a-z][a-z0-9]{0,15}$
                          type: string
                        protocol:
                          description: |-
                            Protocol: beast (30005), sbs (30003, no MLAT results in it) or
                            uatRaw (dump978's raw 30978, from a UAT Receiver).
                          enum:
                          - beast
                          - sbs
                          - uatRaw
                          type: string
                      required:
                      - from
                      - name
                      - protocol
                      type: object
                    maxItems: 4
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  mlat:
                    description: |-
                      Mlat runs squawk's mlat-client beside the client, one per MLAT
                      Receiver the Feed selects (spec.mlat), as aggregator Feeds do.
                    properties:
                      server:
                        description: |-
                          Server is the vendor's mlat-server, or a local tunnel the client
                          opens to it (plane.watch's pw-feeder listens on 127.0.0.1:12346).
                        properties:
                          host:
                            minLength: 1
                            type: string
                          port:
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        required:
                        - host
                        - port
                        type: object
                      userCredential:
                        description: |-
                          UserCredential is the credential key whose value mlat-client sends
                          as --user (plane.watch: the API key).
                        minLength: 1
                        type: string
                    required:
                    - server
                    - userCredential
                    type: object
                  mlatResults:
                    default: none
                    description: |-
                      MlatResults: where the client's MLAT results go. hub: the Hub's
                      MLAT input, given to templates as .Hub.MlatIn. Results stay inside
                      the station either way (DECISIONS: FlightAware MLAT results).
                    enum:
                    - none
                    - hub
                    type: string
                  ports:
                    description: |-
                      Ports the client listens on (status pages): reachable by the agent
                      and the operator only.
                    items:
                      description: VendorPort is a port the client listens on.
                      properties:
                        name:
                          pattern: ^[a-z][a-z0-9-]{0,14}$
                          type: string
                        port:
                          format: int32
                          maximum: 65535
                          minimum: 1024
                          type: integer
                      required:
                      - name
                      - port
                      type: object
                    type: array
                  status:
                    description: |-
                      Status says how to read the client's state and map it to the Feed's
                      conditions.
                    properties:
                      connected:
                        description: 'Connected: the client is connected to its vendor
                          (bool).'
                        minLength: 1
                        type: string
                      interval:
                        description: Interval between readings (default 30s).
                        type: string
                      message:
                        description: Message (string) added to the conditions' messages.
                        type: string
                      mlatSynced:
                        description: MlatSynced (bool), when the client does MLAT.
                        type: string
                      reader:
                        description: |-
                          VendorReader is one of the status readers. The agent sidecar runs the
                          first four in the Pod; logRegex runs in the operator, which reads the
                          client container's log through pods/log and keeps only the time of the
                          last line matching each pattern (data.<name> is that time), never the
                          lines, since vendor logs can carry keys.
                        properties:
                          httpJSON:
                            description: VendorHTTP is a status page on localhost.
                            properties:
                              path:
                                pattern: ^/
                                type: string
                              port:
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                            required:
                            - path
                            - port
                            type: object
                          jsonFile:
                            description: VendorJSONFile is a status file the client
                              writes.
                            properties:
                              path:
                                maxLength: 256
                                pattern: ^/
                                type: string
                            required:
                            - path
                            type: object
                          logRegex:
                            description: 'VendorLogRegex: patterns (RE2) over the
                              client''s log, by name.'
                            properties:
                              patterns:
                                additionalProperties:
                                  type: string
                                minProperties: 1
                                type: object
                            required:
                            - patterns
                            type: object
                          prometheus:
                            description: VendorHTTP is a status page on localhost.
                            properties:
                              path:
                                pattern: ^/
                                type: string
                              port:
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                            required:
                            - path
                            - port
                            type: object
                          tcpEstablished:
                            description: 'VendorTCP: established connections to these
                              remote ports.'
                            properties:
                              remotePorts:
                                items:
                                  format: int32
                                  type: integer
                                minItems: 1
                                type: array
                            required:
                            - remotePorts
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: set exactly one reader
                          rule: '[has(self.jsonFile), has(self.httpJSON), has(self.prometheus),
                            has(self.tcpEstablished), has(self.logRegex)].filter(x,
                            x).size() == 1'
                      receiving:
                        description: |-
                          Receiving: data is arriving at the client and going out (bool). The
                          streak signal: a counter rising between readings, where there is one.
                        type: string
                    required:
                    - connected
                    - reader
                    type: object
                  writablePaths:
                    description: WritablePaths get an emptyDir each; the root filesystem
                      is read-only.
                    items:
                      maxLength: 128
                      pattern: ^/[A-Za-z0-9._/-]+$
                      type: string
                    maxItems: 8
                    type: array
                required:
                - image
                - status
                type: object
                x-kubernetes-validations:
                - message: status.reader.jsonFile.path must be under a writablePath
                    (shared with the agent)
                  rule: '!has(self.status.reader.jsonFile) || (has(self.writablePaths)
                    && self.writablePaths.exists(p, self.status.reader.jsonFile.path.startsWith(p
                    + ''/'')))'
                - message: uatRaw inputs come from a Receiver; the Hub doesn't relay
                    raw UAT
                  rule: '!has(self.inputs) || self.inputs.all(i, i.protocol != ''uatRaw''
                    || i.from == ''receiver'')'
            required:
            - displayName
            type: object
            x-kubernetes-validations:
            - message: set exactly one of aggregator or vendor
              rule: has(self.aggregator) != has(self.vendor)
          status:
            description: FeedTypeStatus reports whether the FeedType can be used.
            properties:
              conditions:
                description: |-
                  Conditions: Valid is False while a vendor status expression doesn't
                  compile (the message has the error); Feeds of the type then show
                  Connected Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
