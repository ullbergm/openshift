apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    kasten/backup: "false"
  annotations:
    reloader.stakater.com/auto: "true"
    prometheus.io/path: /q/metrics
    prometheus.io/port: '8081'
    prometheus.io/scheme: http
    prometheus.io/scrape: 'true'
spec:
  replicas: 2
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: backend
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/controller: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
        prometheus.io/path: /q/metrics
        prometheus.io/port: '8081'
        prometheus.io/scheme: http
        prometheus.io/scrape: 'true'
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 0
        runAsUser: 0
        supplementalGroups:
        - 44
        - 109
        - 100
        - 65535
      containers:
        - name: backend
          env:
          - name: TZ
            value: {{ .Values.cluster.timezone }}
          - name: KUBERNETES_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: SMALLRYE_CONFIG_LOCATIONS
            value: /deployments/config
          {{- range $key, $value := .Values.pods.backend.env }}
          - name: {{ $key }}
            value: "{{ $value }}"
          {{- end }}
          image: {{ .Values.pods.backend.image.repository }}:{{ .Values.pods.backend.image.tag }}
          imagePullPolicy: {{ .Values.pods.backend.image.pullPolicy }}
          volumeMounts:
            - name: config
              readOnly: true
              mountPath: /deployments/config
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
              scheme: HTTP
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            timeoutSeconds: 10
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
