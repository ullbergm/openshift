cluster:
  top_level_domain: example.com
  name: openshift
  admin_email: admin@example.com
  timezone: America/New_York
  #storage:
  #  config:
  #    storageClassName: synology-iscsi

application:
  name: LiteLLM
  group: AI/ML
  icon: subtitles
  iconColor: ""
  description: "Unified API to manage and deploy LLMs"
  port: 4000
  location: 0
  path: /ui
  tags: admin

pods:
  main:
    image:
      repository: ghcr.io/berriai/litellm-non_root
      # renovate: datasource=docker depName=ghcr.io/berriai/litellm-non_root versioning=loose
      tag: main-v1.75.8-stable@sha256:eaa381bfd39b56c89e4a61be15ed87e7af02b65bd82a3f50d923e08a5f6d6027

  db:
    image:
      repository: postgres
      # renovate: datasource=docker depName=postgres versioning=docker
      tag: 17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f

  redis:
    image:
      repository: redis
      tag: "8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

externalSecret:
  data:
    - LITELLM_MASTER_KEY
    - LITELLM_SALT_KEY
