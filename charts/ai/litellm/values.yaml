cluster:
  top_level_domain: example.com
  name: openshift
  admin_email: admin@example.com
  timezone: America/New_York
  #storage:
  #  config:
  #    storageClassName: synology-iscsi

application:
  name: LiteLLM
  group: AI/ML
  icon: subtitles
  iconColor: ""
  description: "Unified API to manage and deploy LLMs"
  port: 4000
  location: 0
  path: /ui
  tags: admin

pods:
  main:
    image:
      repository: ghcr.io/berriai/litellm-non_root
      # renovate: datasource=docker depName=ghcr.io/berriai/litellm-non_root versioning=loose
      tag: main-v1.75.8-stable@sha256:eaa381bfd39b56c89e4a61be15ed87e7af02b65bd82a3f50d923e08a5f6d6027

  db:
    image:
      repository: postgres
      # renovate: datasource=docker depName=postgres versioning=docker
      tag: 17.12@sha256:dbb9623d5121b5d2c2c9e2fba56e40193cbb3510d4af7f035b1ab1823aff3205

  redis:
    image:
      repository: redis
      tag: "8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

externalSecret:
  data:
    - LITELLM_MASTER_KEY
    - LITELLM_SALT_KEY
