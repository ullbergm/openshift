cluster:
  top_level_domain: example.com
  name: openshift
  admin_email: admin@example.com
  timezone: America/New_York
  #storage:
  #  config:
  #    storageClassName: synology-iscsi

application:
  name: LiteLLM
  group: AI/ML
  icon: subtitles
  iconColor: ""
  description: "Unified API to manage and deploy LLMs"
  port: 4000
  location: 0
  path: /ui
  tags: admin

pods:
  main:
    image:
      repository: ghcr.io/berriai/litellm-non_root
      # renovate: datasource=docker depName=ghcr.io/berriai/litellm-non_root versioning=loose
      tag: main-v1.75.8-stable@sha256:eaa381bfd39b56c89e4a61be15ed87e7af02b65bd82a3f50d923e08a5f6d6027

  db:
    image:
      repository: postgres
      # renovate: datasource=docker depName=postgres versioning=docker
      tag: 17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f

  redis:
    image:
      repository: redis
      tag: "8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

externalSecret:
  data:
    - LITELLM_MASTER_KEY
    - LITELLM_SALT_KEY
