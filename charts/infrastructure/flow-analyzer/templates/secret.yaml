{{- if and (not .Values.externalSecret.enabled) (not .Values.secrets.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
type: Opaque
stringData:
  CLICKHOUSE_PASSWORD: {{ required "secrets.clickhousePassword (or secrets.existingSecret) is required when externalSecret.enabled is false" .Values.secrets.clickhousePassword | quote }}
  {{- if .Values.secrets.snmpCommunity }}
  SNMP_COMMUNITY: {{ .Values.secrets.snmpCommunity | quote }}
  {{- end }}
  {{- if .Values.secrets.routerosPassword }}
  ROUTEROS_PASSWORD: {{ .Values.secrets.routerosPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.maxmindLicenseKey }}
  MAXMIND_LICENSE_KEY: {{ .Values.secrets.maxmindLicenseKey | quote }}
  {{- end }}
{{- end }}
