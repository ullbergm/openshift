{{- if and (not .Values.externalSecret.enabled) (not .Values.secrets.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
type: Opaque
stringData:
  CLICKHOUSE_PASSWORD: {{ required "secrets.clickhousePassword (or secrets.existingSecret) is required when externalSecret.enabled is false" .Values.secrets.clickhousePassword | quote }}
  {{- if .Values.secrets.snmpCommunity }}
  SNMP_COMMUNITY: {{ .Values.secrets.snmpCommunity | quote }}
  {{- end }}
  {{- if .Values.secrets.routerosPassword }}
  ROUTEROS_PASSWORD: {{ .Values.secrets.routerosPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.maxmindLicenseKey }}
  MAXMIND_LICENSE_KEY: {{ .Values.secrets.maxmindLicenseKey | quote }}
  {{- end }}
  {{- if .Values.secrets.adguardUser }}
  ADGUARD_USER: {{ .Values.secrets.adguardUser | quote }}
  ADGUARD_PASSWORD: {{ .Values.secrets.adguardPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.alertWebhookUrl }}
  ALERT_WEBHOOK_URL: {{ .Values.secrets.alertWebhookUrl | quote }}
  ALERT_WEBHOOK_HEADERS: {{ .Values.secrets.alertWebhookHeaders | quote }}
  {{- end }}
  {{- if .Values.secrets.alertSmtpUrl }}
  ALERT_SMTP_URL: {{ .Values.secrets.alertSmtpUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.adminToken }}
  ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
  {{- end }}
{{- end }}
