{{- $cfg := index .Values "flow-analyzer" }}
{{- $lan := and $cfg.network $cfg.network.ip }}
{{/*
The collector keeps NetFlow v9 / IPFIX template state in memory, so it runs as
one replica and is replaced rather than rolled: two collectors behind one UDP
address would each see only some of the templates.

Flow exports (and sFlow, when enabled) arrive on a second interface straight
on the LAN (see collector-network.yaml); the routers send to that address, not
to a Service.
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-collector
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: collector
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/controller: collector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
      {{- if $lan }}
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name": "{{ .Release.Name }}-lan", "ips": ["{{ $cfg.network.ip }}/{{ $cfg.network.prefixLength }}"]}]'
      {{- end }}
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- if contains "icmp://" ($cfg.probes.targets | default "") }}
        # Lets the unprivileged collector open the ICMP datagram socket the
        # icmp:// probes need. Namespaced and on Kubernetes' safe list, so
        # the restricted SCC allows it.
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "0 2147483647"
        {{- end }}
      # Long enough for the final flush to ClickHouse.
      terminationGracePeriodSeconds: 30
      containers:
        - name: collector
          image: {{ .Values.pods.collector.image.repository }}:{{ .Values.pods.collector.image.tag }}
          imagePullPolicy: {{ .Values.pods.collector.image.pullPolicy }}
          args: ["flow-analyzer", "collect"]
          env:
            - name: TZ
              value: {{ .Values.cluster.timezone }}
            - name: BIND_ADDR
              value: "0.0.0.0:{{ .Values.pods.collector.port }}"
            - name: HTTP_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.pods.collector.metricsPort }}"
            - name: CLICKHOUSE_URL
              value: http://{{ .Release.Name }}-clickhouse:8123
            - name: CLICKHOUSE_DB
              value: {{ .Values.pods.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.pods.clickhouse.user | quote }}
            - name: ALLOWED_EXPORTERS
              value: {{ $cfg.allowedExporters | default "" | quote }}
            - name: SNMP_TARGETS
              value: {{ $cfg.snmp.targets | default "" | quote }}
            - name: SNMP_VERSION
              value: {{ $cfg.snmp.version | quote }}
            - name: SNMP_INTERVAL_SECS
              value: {{ $cfg.snmp.intervalSecs | quote }}
            - name: SNMP_BRIDGE_TABLES
              value: {{ $cfg.snmp.bridgeTables | quote }}
            - name: SNMP_LLDP
              value: {{ $cfg.snmp.lldp | quote }}
            {{- if $cfg.routeros.devices }}
            - name: ROUTEROS_DEVICES
              value: {{ $cfg.routeros.devices | quote }}
            - name: ROUTEROS_INSECURE
              value: {{ $cfg.routeros.insecure | quote }}
            - name: ROUTEROS_DNS_CACHE
              value: {{ $cfg.routeros.dnsCache | quote }}
            - name: ROUTEROS_INTERVAL_SECS
              value: {{ $cfg.routeros.intervalSecs | quote }}
            - name: ROUTEROS_TIMEOUT_SECS
              value: {{ $cfg.routeros.timeoutSecs | quote }}
            # The connection table (what FastTrack hides from Traffic Flow)
            # and the other groups, each on its own interval (0 = off).
            - name: ROUTEROS_CONNECTIONS
              value: {{ $cfg.routeros.connections | quote }}
            - name: ROUTEROS_CONNECTIONS_INTERVAL_SECS
              value: {{ $cfg.routeros.connectionsIntervalSecs | quote }}
            - name: ROUTEROS_CONNECTIONS_FASTTRACK_ONLY
              value: {{ $cfg.routeros.connectionsFasttrackOnly | quote }}
            - name: ROUTEROS_CONNECTIONS_MAX
              value: {{ $cfg.routeros.connectionsMax | quote }}
            - name: ROUTEROS_HEALTH_INTERVAL_SECS
              value: {{ $cfg.routeros.healthIntervalSecs | quote }}
            - name: ROUTEROS_WIRELESS_INTERVAL_SECS
              value: {{ $cfg.routeros.wirelessIntervalSecs | quote }}
            - name: ROUTEROS_QUEUES_INTERVAL_SECS
              value: {{ $cfg.routeros.queuesIntervalSecs | quote }}
            - name: ROUTEROS_NETWATCH_INTERVAL_SECS
              value: {{ $cfg.routeros.netwatchIntervalSecs | quote }}
            - name: ROUTEROS_FIREWALL_INTERVAL_SECS
              value: {{ $cfg.routeros.firewallIntervalSecs | quote }}
            {{- end }}
            {{- if $cfg.adguard.url }}
            # AdGuard Home query log as passive DNS; the login, if any, is
            # ADGUARD_USER / ADGUARD_PASSWORD from the Secret.
            - name: ADGUARD_URL
              value: {{ $cfg.adguard.url | quote }}
            - name: ADGUARD_INTERVAL_SECS
              value: {{ $cfg.adguard.intervalSecs | quote }}
            {{- end }}
            {{- if $cfg.probes.targets }}
            - name: PROBE_TARGETS
              value: {{ $cfg.probes.targets | quote }}
            - name: PROBE_INTERVAL_SECS
              value: {{ $cfg.probes.intervalSecs | quote }}
            - name: PROBE_TIMEOUT_SECS
              value: {{ $cfg.probes.timeoutSecs | quote }}
            {{- end }}
            {{- if $cfg.sflow.enabled }}
            - name: SFLOW_BIND_ADDR
              value: "0.0.0.0:6343"
            {{- end }}
            {{- if $cfg.forwardTo }}
            - name: FORWARD_TO
              value: {{ $cfg.forwardTo | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.pods.collector.logLevel | quote }}
          envFrom:
            # CLICKHOUSE_PASSWORD, SNMP_COMMUNITY and, when those pollers are
            # on, ROUTEROS_PASSWORD and ADGUARD_USER / ADGUARD_PASSWORD
            - secretRef:
                name: {{ include "flow-analyzer.secretName" . }}
          ports:
            - name: netflow
              containerPort: {{ .Values.pods.collector.port }}
              protocol: UDP
            {{- if $cfg.sflow.enabled }}
            - name: sflow
              containerPort: 6343
              protocol: UDP
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.pods.collector.metricsPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.pods.collector.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-collector-metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.pods.collector.metricsPort | quote }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.pods.collector.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/controller: collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
