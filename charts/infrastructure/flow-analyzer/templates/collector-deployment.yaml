{{- $cfg := index .Values "flow-analyzer" }}
{{- $lan := and $cfg.network $cfg.network.ip }}
{{/*
The collector keeps NetFlow v9 / IPFIX template state in memory, so it runs as
one replica and is replaced rather than rolled: two collectors behind one UDP
address would each see only some of the templates.

It runs on the host network. The pod network's MTU is 1400 and OVN answers
larger packets from the LAN with ICMP "fragmentation needed" instead of
fragmenting them; the MikroTik fills its IPFIX datagrams to 1412 bytes and
ignores the ICMP, so three quarters of the datagrams (and nearly all flow
records) never reached a pod-networked collector. On the host network the
socket sits behind the node's 1500-byte interface. Both UDP 2055 and the
metrics port are therefore bound on the node itself.
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-collector
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: collector
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/controller: collector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ .Release.Name }}-collector
      automountServiceAccountToken: false
      hostNetwork: true
      # Keep resolving cluster Services (ClickHouse) from the host network.
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Long enough for the final flush to ClickHouse.
      terminationGracePeriodSeconds: 30
      containers:
        - name: collector
          image: {{ .Values.pods.collector.image.repository }}:{{ .Values.pods.collector.image.tag }}
          imagePullPolicy: {{ .Values.pods.collector.image.pullPolicy }}
          args: ["flow-analyzer", "collect"]
          env:
            - name: TZ
              value: {{ .Values.cluster.timezone }}
            - name: BIND_ADDR
              value: "0.0.0.0:{{ .Values.pods.collector.port }}"
            - name: HTTP_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.pods.collector.metricsPort }}"
            - name: CLICKHOUSE_URL
              value: http://{{ .Release.Name }}-clickhouse:8123
            - name: CLICKHOUSE_DB
              value: {{ .Values.pods.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.pods.clickhouse.user | quote }}
            - name: ALLOWED_EXPORTERS
              value: {{ $cfg.allowedExporters | default "" | quote }}
            - name: SNMP_TARGETS
              value: {{ $cfg.snmp.targets | default "" | quote }}
            - name: SNMP_VERSION
              value: {{ $cfg.snmp.version | quote }}
            - name: SNMP_INTERVAL_SECS
              value: {{ $cfg.snmp.intervalSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.pods.collector.logLevel | quote }}
          envFrom:
            # CLICKHOUSE_PASSWORD and SNMP_COMMUNITY
            - secretRef:
                name: {{ .Release.Name }}
          ports:
            - name: netflow
              containerPort: {{ .Values.pods.collector.port }}
              protocol: UDP
            - name: metrics
              containerPort: {{ .Values.pods.collector.metricsPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.pods.collector.resources | nindent 12 }}
---
# Flow exports enter here. A Route cannot carry UDP, so MetalLB gives the
# Service a LAN address. externalTrafficPolicy Local makes MetalLB announce it
# from the node running the collector, which keeps the router's source
# address; with Cluster, OVN would SNAT every datagram to 100.64.0.x and the
# collector could not tell exporters apart. The endpoint is the node itself
# (host network), so the datagrams never enter the 1400-byte pod network.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-collector
  {{- if $lan }}
  annotations:
    metallb.io/loadBalancerIPs: {{ $cfg.network.ip | quote }}
  {{- end }}
spec:
  {{- if $lan }}
  type: LoadBalancer
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: false
  # OpenShift's ingress-IP controller (network.config externalIP
  # autoAssignCIDRs) copies a LoadBalancer's status address into
  # spec.externalIPs; declaring it here keeps the Service in sync.
  externalIPs:
    - {{ $cfg.network.ip }}
  {{- else }}
  type: ClusterIP
  {{- end }}
  ports:
    - name: netflow
      port: {{ .Values.pods.collector.port }}
      targetPort: netflow
      protocol: UDP
  selector:
    app.kubernetes.io/controller: collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-collector-metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.pods.collector.metricsPort | quote }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.pods.collector.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/controller: collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
