{{- $cfg := index .Values "flow-analyzer" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/controller: web-api
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/controller: web-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      # Static binary on distroless/static:nonroot; runs under the restricted SCC.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-api
          image: {{ .Values.pods.webApi.image.repository }}:{{ .Values.pods.webApi.image.tag }}
          imagePullPolicy: {{ .Values.pods.webApi.image.pullPolicy }}
          args: ["web-api"]
          env:
            - name: TZ
              value: {{ .Values.cluster.timezone }}
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.pods.webApi.port }}"
            - name: CLICKHOUSE_URL
              value: http://{{ .Release.Name }}-clickhouse:8123
            - name: CLICKHOUSE_DB
              value: {{ .Values.pods.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.pods.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-analyzer.secretName" . }}
                  key: CLICKHOUSE_PASSWORD
            - name: INTERNAL_SUBNETS
              value: {{ $cfg.internalSubnets | quote }}
            {{- if $cfg.knownNetworks }}
            - name: KNOWN_NETWORKS
              value: {{ $cfg.knownNetworks | quote }}
            {{- end }}
            {{- if $cfg.interfaceRoles }}
            - name: INTERFACE_ROLES
              value: {{ $cfg.interfaceRoles | quote }}
            {{- end }}
            - name: THREAT_FEEDS
              value: {{ $cfg.threatFeeds | quote }}
            {{- if $cfg.access.header }}
            - name: ADMIN_HEADER
              value: {{ $cfg.access.header | quote }}
            - name: ADMIN_VALUES
              value: {{ $cfg.access.values | quote }}
            {{- end }}
            {{- if $cfg.access.token }}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-analyzer.secretName" . }}
                  key: ADMIN_TOKEN
            {{- end }}
            # Alerting: the engine runs in this one replica.
            - name: ALERTS_ENABLED
              value: {{ $cfg.alerts.enabled | quote }}
            - name: DNS_SERVERS
              value: {{ $cfg.alerts.dnsServers | default "" | quote }}
            - name: NTP_SERVERS
              value: {{ $cfg.alerts.ntpServers | default "" | quote }}
            - name: MAIL_HOSTS
              value: {{ $cfg.alerts.mailHosts | default "" | quote }}
            - name: ALERT_MIN_SEVERITY
              value: {{ $cfg.alerts.minSeverity | quote }}
            - name: ALERT_FIREWALL_WATCH
              value: {{ $cfg.alerts.firewallWatch | default "" | quote }}
            - name: DASHBOARD_URL
              value: {{ $cfg.alerts.dashboardUrl | default (printf "https://%s.apps.%s.%s" .Release.Name .Values.cluster.name .Values.cluster.top_level_domain) | quote }}
            {{- if $cfg.alerts.webhook.enabled }}
            - name: ALERT_WEBHOOK_FORMAT
              value: {{ $cfg.alerts.webhook.format | quote }}
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-analyzer.secretName" . }}
                  key: ALERT_WEBHOOK_URL
            - name: ALERT_WEBHOOK_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-analyzer.secretName" . }}
                  key: ALERT_WEBHOOK_HEADERS
                  optional: true
            {{- end }}
            {{- if $cfg.alerts.email.enabled }}
            - name: ALERT_SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-analyzer.secretName" . }}
                  key: ALERT_SMTP_URL
            - name: ALERT_EMAIL_FROM
              value: {{ $cfg.alerts.email.from | quote }}
            - name: ALERT_EMAIL_TO
              value: {{ $cfg.alerts.email.to | quote }}
            {{- if $cfg.alerts.report.schedule }}
            - name: REPORT_SCHEDULE
              value: {{ $cfg.alerts.report.schedule | quote }}
            - name: REPORT_EMAIL_TO
              value: {{ $cfg.alerts.report.to | default $cfg.alerts.email.to | quote }}
            {{- end }}
            {{- end }}
            {{- if $cfg.dnsServer }}
            # web-api 0.2.0 rejects an empty DNS_SERVER, so only set it when given.
            - name: DNS_SERVER
              value: {{ $cfg.dnsServer | quote }}
            {{- end }}
            # The collector's Prometheus page, read for the dashboard's Status
            # page (collector counters). Without it that page shows only what
            # ClickHouse knows.
            - name: COLLECTOR_METRICS_URL
              value: http://{{ .Release.Name }}-collector-metrics:{{ .Values.pods.collector.metricsPort }}/metrics
            {{- if and $cfg.dpi.enabled $cfg.dpi.browse }}
            # The collector serves its ring of recent packets to this token
            # (0.22.0 or later); admins browse it on the Packets page.
            - name: PACKET_RING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-analyzer.secretName" . }}
                  key: PACKET_RING_TOKEN
            {{- end }}
            {{- if $cfg.geoip.url }}
            # GeoIP database for the Internet page's map and the location in
            # the IP inspector; downloaded to the emptyDir below (the root
            # filesystem is read-only) and refreshed every GEOIP_REFRESH_SECS.
            - name: GEOIP_DB
              value: /var/lib/flow-analyzer/geoip.mmdb
            - name: GEOIP_URL
              value: {{ $cfg.geoip.url | quote }}
            - name: GEOIP_REFRESH_SECS
              value: {{ $cfg.geoip.refreshSecs | quote }}
            {{- end }}
            {{- if $cfg.geoip.asnUrl }}
            # ASN database: which network announces an address, answered
            # from the file before Team Cymru's DNS service; downloaded to
            # the same emptyDir and refreshed on the same schedule.
            - name: GEOIP_ASN_DB
              value: /var/lib/flow-analyzer/asn.mmdb
            - name: GEOIP_ASN_URL
              value: {{ $cfg.geoip.asnUrl | quote }}
            {{- if not $cfg.geoip.url }}
            - name: GEOIP_REFRESH_SECS
              value: {{ $cfg.geoip.refreshSecs | quote }}
            {{- end }}
            {{- end }}
            {{- if or (contains "{license_key}" $cfg.geoip.url) (contains "{license_key}" $cfg.geoip.asnUrl) }}
            - name: MAXMIND_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-analyzer.secretName" . }}
                  key: MAXMIND_LICENSE_KEY
            {{- end }}
            # Daily look at the container registry for a newer release, shown
            # on the dashboard's Status page.
            - name: UPDATE_CHECK
              value: {{ ternary "on" "off" $cfg.updateCheck.enabled | quote }}
            {{- if $cfg.updateCheck.registry }}
            - name: UPDATE_CHECK_REGISTRY
              value: {{ $cfg.updateCheck.registry | quote }}
            {{- end }}
            {{- if $cfg.updateCheck.images }}
            - name: UPDATE_CHECK_IMAGES
              value: {{ $cfg.updateCheck.images | quote }}
            {{- end }}
            # Claude explanations of alerts, asked for from an alert's page.
            - name: ALERT_EXPLAIN
              value: {{ ternary "on" "off" $cfg.alertExplain.enabled | quote }}
            {{- if include "flow-analyzer.aiOn" . }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-analyzer.secretName" . }}
                  key: ANTHROPIC_API_KEY
                  # Without it the web-api starts with the Claude features off.
                  optional: true
            {{- end }}
            {{- if $cfg.alertExplain.enabled }}
            - name: ALERT_EXPLAIN_REDACT
              value: {{ ternary "on" "off" $cfg.alertExplain.redact | quote }}
            {{- if $cfg.alertExplain.model }}
            - name: ALERT_EXPLAIN_MODEL
              value: {{ $cfg.alertExplain.model | quote }}
            {{- end }}
            {{- end }}
            - name: AI_IDENTIFY
              value: {{ ternary "on" "off" $cfg.ai.identify | quote }}
            - name: AI_IDENTIFY_NIGHTLY
              value: {{ ternary "on" "off" $cfg.ai.identifyNightly | quote }}
            - name: AI_DIGEST
              value: {{ ternary "on" "off" $cfg.ai.digest | quote }}
            - name: AI_LOG_EXPLAIN
              value: {{ ternary "on" "off" $cfg.ai.logExplain | quote }}
            - name: AI_ASK
              value: {{ ternary "on" "off" $cfg.ai.ask | quote }}
            - name: AI_REDACT
              value: {{ ternary "on" "off" $cfg.ai.redact | quote }}
            - name: AI_DAILY_BUDGET_USD
              value: {{ $cfg.ai.dailyBudgetUsd | toString | quote }}
            {{- if $cfg.ai.model }}
            - name: AI_MODEL
              value: {{ $cfg.ai.model | quote }}
            {{- end }}
            {{- if $cfg.ai.askModel }}
            - name: AI_ASK_MODEL
              value: {{ $cfg.ai.askModel | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.pods.webApi.logLevel | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.pods.webApi.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.pods.webApi.resources | nindent 12 }}
          {{- if or $cfg.geoip.url $cfg.geoip.asnUrl }}
          volumeMounts:
            - name: geoip
              mountPath: /var/lib/flow-analyzer
      volumes:
        # The downloaded GeoIP (and ASN) databases; fetched again after a
        # restart.
        - name: geoip
          emptyDir:
            sizeLimit: 512Mi
          {{- end }}
---
# The dashboard image's nginx.conf proxies /graphql to http://web-api:8042, so
# this Service keeps that fixed name rather than the release-prefixed one. It
# is not exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: web-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.pods.webApi.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/controller: web-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
