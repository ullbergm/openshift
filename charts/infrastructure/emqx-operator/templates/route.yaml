{{- if .Capabilities.APIVersions.Has "route.openshift.io/v1" }}
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  annotations:
    route.openshift.io/termination: "edge"
  name: emqx
spec:
  host: "emqx.apps.{{ .Values.cluster.name }}.{{ .Values.cluster.top_level_domain }}"
  path: /
  to:
    kind: Service
    name: emqx-dashboard
    weight: 100
  port:
    targetPort: dashboard
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- else }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emqx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "emqx.apps.{{ .Values.cluster.name }}.{{ .Values.cluster.top_level_domain }}"
      secretName: "emqx-tls"
  rules:
    - host: "emqx.apps.{{ .Values.cluster.name }}.{{ .Values.cluster.top_level_domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emqx-dashboard
                port:
                  name: dashboard
{{- end }}
