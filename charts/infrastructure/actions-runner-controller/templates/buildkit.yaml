{{- if .Values.buildkit.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildkit
automountServiceAccountToken: false
---
# nested-container requires a pod user namespace and allows only SETUID/SETGID,
# which newuidmap needs to set up BuildKit's rootless sandbox. Nothing BuildKit
# holds applies outside the pod's user namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildkit-nested-container
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nested-container
subjects:
  - kind: ServiceAccount
    name: buildkit
    namespace: {{ .Release.Namespace }}
---
# The image maps sub-IDs from 100000, outside the 65536 IDs a pod user
# namespace has. Map every remaining ID in the pod instead, so images can use
# the full 0-65535 range (distroless nonroot is 65532).
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkit-subid
data:
  subid: |
    user:1001:64535
    user:0:1000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkit
  labels:
    app.kubernetes.io/name: buildkit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkit
    spec:
      serviceAccountName: buildkit
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # The default profile blocks creating the nested user namespace that
        # BuildKit's rootless mode runs in.
        seccompProfile:
          type: Unconfined
      containers:
        - name: buildkitd
          image: "{{ .Values.buildkit.image.repository }}:{{ .Values.buildkit.image.tag }}"
          imagePullPolicy: {{ .Values.buildkit.image.pullPolicy }}
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:{{ .Values.buildkit.port }}
            - --oci-worker-no-process-sandbox
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID"]
          env:
            - name: TZ
              value: {{ .Values.cluster.timezone | quote }}
          ports:
            - name: buildkit
              containerPort: {{ .Values.buildkit.port }}
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          {{- with .Values.buildkit.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: /home/user/.local/share/buildkit
            - name: subid
              mountPath: /etc/subuid
              subPath: subid
            - name: subid
              mountPath: /etc/subgid
              subPath: subid
      volumes:
        - name: state
          emptyDir: {}
        - name: subid
          configMap:
            name: buildkit-subid
---
apiVersion: v1
kind: Service
metadata:
  name: buildkit
  labels:
    app.kubernetes.io/name: buildkit
spec:
  selector:
    app.kubernetes.io/name: buildkit
  ports:
    - name: buildkit
      port: {{ .Values.buildkit.port }}
      targetPort: buildkit
---
# The daemon is unauthenticated: only pods in this namespace may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: buildkit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.buildkit.port }}
{{- end }}
