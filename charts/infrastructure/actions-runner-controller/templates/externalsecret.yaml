{{- $cfg := index .Values "actions-runner-controller" }}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: external-secrets
  target:
    name: {{ .Release.Name }}-github
    creationPolicy: Owner
  data:
    {{- if eq $cfg.auth.type "token" }}
    - secretKey: github_token
      remoteRef:
        key: GITHUB_ACTIONS_RUNNER_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- else }}
    - secretKey: github_app_id
      remoteRef:
        key: GITHUB_ACTIONS_RUNNER_APP_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: github_app_installation_id
      remoteRef:
        key: GITHUB_ACTIONS_RUNNER_APP_INSTALLATION_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: github_app_private_key
      remoteRef:
        key: GITHUB_ACTIONS_RUNNER_APP_PRIVATE_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
