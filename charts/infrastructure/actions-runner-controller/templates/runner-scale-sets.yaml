{{- /*
One AutoscalingRunnerSet per repository (or one for the organization), with the
supporting resources the upstream gha-runner-scale-set chart creates per release.
That chart is one release per scale set, which does not fit a values-driven list.
*/ -}}
{{- $cfg := index .Values "actions-runner-controller" }}
{{- $ctrl := index .Subcharts "gha-runner-scale-set-controller" }}
{{- $sets := include "actions-runner-controller.scaleSets" . | fromJsonArray }}
{{- range $set := $sets }}
{{- $labels := include "actions-runner-controller.scaleSetLabels" (dict "root" $ "name" $set.name) }}
{{- $serviceAccount := printf "%s-gha-rs-no-permission" $set.name }}
{{- $manager := printf "%s-gha-rs-manager" $set.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccount }}
  labels:
    {{- $labels | nindent 4 }}
  finalizers:
    - actions.github.com/cleanup-protection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $manager }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: manager-role
  finalizers:
    - actions.github.com/cleanup-protection
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "roles"]
    verbs: ["create", "delete", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $manager }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: manager-role-binding
  finalizers:
    - actions.github.com/cleanup-protection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $manager }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gha-runner-scale-set-controller.serviceAccountName" $ctrl }}
    namespace: {{ $.Release.Namespace }}
---
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: {{ $set.name }}
  labels:
    app.kubernetes.io/component: autoscaling-runner-set
    {{- $labels | nindent 4 }}
  annotations:
    # The controller recreates the listener when this hash changes.
    actions.github.com/values-hash: {{ dict "set" $set "config" (omit $cfg "repositories") "runner" $.Values.runner "dind" $.Values.dind | toJson | sha256sum | trunc 63 }}
    actions.github.com/cleanup-manager-role-binding: {{ $manager }}
    actions.github.com/cleanup-manager-role-name: {{ $manager }}
    actions.github.com/cleanup-no-permission-service-account-name: {{ $serviceAccount }}
spec:
  githubConfigUrl: {{ $set.url }}
  githubConfigSecret: {{ $.Release.Name }}-github
  runnerScaleSetName: {{ $cfg.runnerScaleSetName }}
  minRunners: {{ $cfg.minRunners | int }}
  maxRunners: {{ $cfg.maxRunners | int }}
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $serviceAccount }}
      # Root and the Docker daemon's privileges exist only inside the pod's
      # user namespace; on the node the pod runs as unprivileged UIDs.
      hostUsers: false
      initContainers:
        - name: init-dind-externals
          image: "{{ $.Values.runner.image.repository }}:{{ $.Values.runner.image.tag }}"
          imagePullPolicy: {{ $.Values.runner.image.pullPolicy }}
          command: ["cp"]
          args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
        - name: dind
          image: "{{ $.Values.dind.image.repository }}:{{ $.Values.dind.image.tag }}"
          imagePullPolicy: {{ $.Values.dind.image.pullPolicy }}
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          securityContext:
            privileged: true
          restartPolicy: Always
          startupProbe:
            exec:
              command: ["docker", "info"]
            initialDelaySeconds: 0
            failureThreshold: 24
            periodSeconds: 5
          {{- with $.Values.dind.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
      containers:
        - name: runner
          image: "{{ $.Values.runner.image.repository }}:{{ $.Values.runner.image.tag }}"
          imagePullPolicy: {{ $.Values.runner.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- with $.Values.runner.packages }}
              sudo apt-get update -q \
                && sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends {{ join " " . }} \
                || echo "⚠️ Package installation failed, starting the runner without them"
              {{- end }}
              exec /home/runner/run.sh
          securityContext:
            runAsUser: 1001
          env:
            - name: TZ
              value: {{ $.Values.cluster.timezone | quote }}
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
          {{- with $.Values.runner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
      volumes:
        - name: work
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
{{- end }}
{{- if $sets }}
---
# Runner pods need root (sudo, apt-get) and a Docker daemon. This grants both
# only to pods that run in their own user namespace, so neither is root or
# privileged on the node. No host namespaces, host paths or host ports.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ .Release.Name }}-runner
userNamespaceLevel: RequirePodLevel
allowPrivilegedContainer: true
allowPrivilegeEscalation: true
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - "*"
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - projected
  - secret
users:
  {{- range $set := $sets }}
  - system:serviceaccount:{{ $.Release.Namespace }}:{{ $set.name }}-gha-rs-no-permission
  {{- end }}
{{- end }}
