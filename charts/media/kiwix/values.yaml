cluster:
  top_level_domain: example.com
  name: openshift
  admin_email: admin@example.com
  timezone: America/New_York
  storage:
    #config:
    #  storageClassName: synology-iscsi
    media:
      nfs:
        server: nas
        path: /volume1/media

application:
  name: Kiwix
  group: Media
  icon: book-open-variant
  iconColor: ""
  image: "https://en.wikipedia.org/wiki/Kiwix#/media/File:Kiwix_logo_v3.svg"
  description: "Offline knowledge server"
  port: 8080
  location: 0

pods:
  main:
    image:
      # renovate: datasource=docker depName=ghcr.io/kiwix/kiwix-tools
      repository: ghcr.io/kiwix/kiwix-serve
      tag: "3.8.2"
      pullPolicy: IfNotPresent

zimUpdater:
  enabled: true
  # Cron schedule for checking and downloading updated ZIM files.
  # Default: every Sunday at 02:00.
  schedule: "0 2 * * 0"
  image:
    # renovate: datasource=docker depName=python versioning=docker
    repository: python
    tag: "3.14-slim"
    pullPolicy: IfNotPresent
  kiwixTools:
    version: "3.8.2"
    # Optional SHA-256 checksum for the downloaded archive.
    # Leave empty to skip checksum verification.
    sha256: ""
  # Books renamed in the Kiwix catalog, as "<new book name>: <old filename prefix>".
  # Once the new book is on disk, files matching "<old filename prefix>_*.zim" are
  # removed from library.xml and deleted. Entries can be dropped after one clean run.
  supersededBooks:
    wiktionary_en-simple_all: wiktionary_en_simple_all
    irp.fas.org_en_military-medicine: fas-military-medicine_en
    canadian-prepper_en_bugoutconcepts: canadian_prepper_bugoutconcepts_en
    canadian-prepper_en_preppingfood: canadian_prepper_preppingfood_en
    canadian-prepper_en_winterprepping: canadian_prepper_winterprepping_en
    canadian-prepper_en_bugoutroll: canadian_prepper_bugoutroll_en
  # List of Kiwix book names to keep up to date.
  # Names use underscores and match the "name" attribute in the Kiwix library catalog:
  #   https://download.kiwix.org/library/library_zim.xml
  # Examples: wikipedia_en_all_mini, wiktionary_en_all, ifixit_mul_all
