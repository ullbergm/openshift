cluster:
  top_level_domain: example.com
  name: openshift
  admin_email: admin@example.com
  timezone: America/New_York
  storage:
    #config:
    #  storageClassName: synology-iscsi
    media:
      nfs:
        server: nas
        path: /volume1/media

application:
  name: Kiwix
  group: Media
  icon: book-open-variant
  iconColor: ""
  image: "https://www.kiwix.org/wp-content/uploads/2019/07/cropped-Kiwix_icon-192x192.png"
  description: "Offline knowledge server"
  port: 8080
  location: 0

pods:
  main:
    image:
      # renovate: datasource=docker depName=ghcr.io/kiwix/kiwix-tools
      repository: ghcr.io/kiwix/kiwix-serve
      tag: "3.8.2"
      pullPolicy: IfNotPresent

zimUpdater:
  enabled: true
  # Cron schedule for checking and downloading updated ZIM files.
  # Default: every Sunday at 02:00.
  schedule: "0 2 * * 0"
  image:
    # renovate: datasource=docker depName=python versioning=docker
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent
  kiwixTools:
    version: "3.8.2"
    # Optional SHA-256 checksum for the downloaded archive.
    # Leave empty to skip checksum verification.
    sha256: ""
  # List of Kiwix book names to keep up to date.
  # Names use underscores and match the "name" attribute in the Kiwix library catalog:
  #   https://download.kiwix.org/library/library_zim.xml
  # Examples: wikipedia_en_all_mini, wiktionary_en_all, ifixit_mul_all
  books:
    - wikipedia_en_all                        # 115G
    - wikipedia_sv_all                        # 16G
    - wiktionary_en_all                       # 8G
    - wiktionary_sv_all                       # 415M
    - wikivoyage_en_all                       # 1G
    - wikivoyage_sv_all                       # 21M
    - wikiversity_en_all                      # 2G
    - wikiversity_sv_all                      # 8M
    - wikisource_en_all                       # 18G
    - wikisource_sv_all                       # 622M
    - wikinews_en_all                         # 303M
    - wikinews_sv_all                         # 12M
    - wikibooks_en_all                        # 5G
    - wikibooks_sv_all                        # 39M
    - wikiquote_en_all                        # 880M
    - wikiquote_sv_all                        # 13M
    - phet_mul_all                            # 227M
    - libretexts.org_en_bio                   # 2G
    - libretexts.org_en_biz                   # 771M
    - libretexts.org_en_biz                   # 801M
    - libretexts.org_en_chem                  # 2G
    - libretexts.org_en_eng                   # 647M
    - libretexts.org_en_geo                   # 1G
    - libretexts.org_en_geo                   # 1G
    - libretexts.org_en_human                 # 3G
    - libretexts.org_en_k12                   # 354M
    - libretexts.org_en_k12                   # 353M
